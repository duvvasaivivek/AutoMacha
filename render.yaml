# render.yaml — Render Blueprint for AutoMacha
# Covers: Backend (Django/Daphne), Celery Worker, PostgreSQL
# NOTE: Create Redis manually on Render Dashboard, then paste the connection string
#       into REDIS_URL, CELERY_BROKER_URL, CELERY_RESULT_BACKEND env vars.

services:
  # ── Backend API (Django + Daphne ASGI for HTTP + WebSockets) ──
  - type: web
    name: automacha-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: automacha-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: automacha-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: automacha-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: automacha-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: automacha-db
          property: port
      - key: USE_REDIS_CACHE
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

databases:
  - name: automacha-db
    plan: free
    region: singapore
    databaseName: automacha
    user: automacha
